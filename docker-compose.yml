services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-assistent-frontend:latest
    container_name: ai-assistent-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_URL: "${BACKEND_URL:-http://host.docker.internal:5005}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
